{% extends "base.html" %}

{% block content %}

<form action="/add_author" method="POST">
    <label for="name">Author Name:</label>
    <input type="text" id="name" name="name" value="{{name or ''}}" required><br><br>

    <label for="birthdate" >Birthdate:</label>
    <input type="date" id="birthdate" name="birthdate" value="{{ birthdate or '' }}" required><br><br>
    <label for="date_of_death">Date of Death:</label>
    <input type="date" id="date_of_death" name="date_of_death" value="{{ date_of_death or '' }}"><br><br>
    <input type="submit" value="Add Author">
</form>

{% endblock %}
