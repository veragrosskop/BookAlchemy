{% extends "base.html" %}

{% block content %}


  <form action="/add_book" method="POST">

    <label for="isbn">ISBN:</label>
    <input type="text" id="isbn" name="isbn" value="{{ form.isbn if form else '' }}" required><br><br>


    <label for="title">Title:</label>
    <input type="text" id="title" name="title" value="{{ form.title if form else '' }}" required><br><br>

    <label for="publication_year">Publication Year:</label>
    <input type="number" id="publication_year" name="publication_year" value="{{ form.publication_year if form else '' }}"><br><br>

    <label for="author_id">Author:</label>
    <select id="author_id" name="author_id">
        <option value="">-- Select Author --</option>
        {% for author in authors %}
            <option value="{{ author.id }}"
                {% if form and form.author_id == author.id|string %}selected{% endif %}>
                {{ author.name }}
            </option>
        {% endfor %}
    </select><br><br>
    <input type="submit" value="Add Book">

  </form>

{% endblock %}
